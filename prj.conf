# --- ZARZĄDZANIE ENERGIĄ (USYPIANIE PERYFERIÓW) ---
CONFIG_PM_DEVICE=y

# --- OBSŁUGA MAGISTRALI I CZUJNIKÓW ---
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_SHT4X=y

# --- OBSŁUGA BATERII (ADC, GPIO) ---
CONFIG_ADC=y
CONFIG_GPIO=y

# --- STOS BLUETOOTH (BLE) ---
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="SHT41_Sensor"
CONFIG_BT_DEVICE_APPEARANCE=833

# --- OPTYMALIZACJA PAMIĘCI RAM DLA BLUETOOTH ---
CONFIG_BT_BUF_ACL_RX_SIZE=27
CONFIG_BT_BUF_ACL_TX_SIZE=27
CONFIG_BT_L2CAP_TX_MTU=23

